ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Some pinned direct dependencies still resolve vulnerable transitive releases.
# These overrides keep the direct dependencies stable while forcing patched
# transitive versions, and `pnpm audit --prod` checks they are still needed.
#
# PostCSS and Sharp come through Next 16.2.12. Nanoid comes through PostCSS,
# while Hono is an optional peer resolved through Better Auth's convex-helpers.
#
# They live here rather than under `pnpm.overrides` in `package.json` because
# **pnpm 10.33 stopped reading that field** — it warns on every command and
# ignores the keys. The pins survived only because the lockfile still recorded
# the old resolution, which is not a guarantee, just inertia: the next install
# that re-resolved anything would have quietly dropped them.
overrides:
  hono: "4.12.34"
  nanoid: "3.3.18"
  next>postcss: "8.5.25"
  next>sharp: "0.35.3"
