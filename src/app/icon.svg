<!--
  The Workeee mark: the board, reduced to four shapes.

  Three bars descending left to right are the three statuses every project is
  seeded with, drawn as how full each column is. The fourth shape is detached
  and sits above the shortest bar: the card in flight, which is the one thing
  this product actually does. Without it the mark is a bar chart; with it, it
  is a board.

  Geometry on a 64 grid: bars 12 wide, gaps 6, baseline at 54, corner 3 on all
  four shapes so nothing in the glyph is rounder than anything else. Graphite
  tile, signal lime glyph, which are the dark theme background and accent.

  XML comments may not contain a double hyphen, so no CSS token is named here
  the way CSS would name it. An invalid comment makes the whole file
  unparseable and the favicon silently disappears.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="15" fill="#0B0C0F" />
  <g fill="#CBF14B">
    <rect x="8" y="10" width="12" height="44" rx="3" />
    <rect x="26" y="24" width="12" height="30" rx="3" />
    <rect x="44" y="38" width="12" height="16" rx="3" />
    <rect x="44" y="20" width="12" height="10" rx="3" />
  </g>
</svg>
